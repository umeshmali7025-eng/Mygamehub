<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro PC Game Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>⚡ RETRO WEB GAMES</h1>
    <p>पुराने क्लासिक पीसी गेम्स - बिना डाउनलोड सीधे ब्राउज़र में खेलें</p>
  </header>

  <main class="container">
    <!-- गेम स्क्रीन कंटेनर -->
    <div id="player-container" class="player-box hidden">
      <div class="player-header">
        <span id="current-game-title">Game Name</span>
        <button onclick="closeGame()" class="close-btn">❌ बंद करें</button>
      </div>
      <iframe id="game-frame" src="" allowfullscreen></iframe>
    </div>

    <!-- गेम्स की लिस्ट -->
    <div class="games-grid">
      <!-- Game 1: Doom 1993 (Classic PC) -->
      <div class="game-card">
        <div class="card-info">
          <h3>Doom (1993 PC)</h3>
          <p>क्लासिक 90s FPS शूटर गेम</p>
          <button onclick="loadGame('Doom (1993)', 'https://dos.zone/player/?bundleUrl=https%3A%2F%2Fcdn.dos.zone%2Fcustom%2Fdos%2Fdoom.jsdos?anonymous=1')">Play Now</button>
        </div>
      </div>

      <!-- Game 2: Prince of Persia (DOS) -->
      <div class="game-card">
        <div class="card-info">
          <h3>Prince of Persia</h3>
          <p>ऑरिजिनल रेट्रो पीसी प्लैटफ़ॉर्मर</p>
          <button onclick="loadGame('Prince of Persia', 'https://dos.zone/player/?bundleUrl=https%3A%2F%2Fcdn.dos.zone%2Fcustom%2Fdos%2Fprince-of-persia.jsdos?anonymous=1')">Play Now</button>
        </div>
      </div>

      <!-- Game 3: Pac-Man HTML5 -->
      <div class="game-card">
        <div class="card-info">
          <h3>Classic Pac-Man</h3>
          <p>ओरिजिनल आर्केड स्टाइल गेम</p>
          <button onclick="loadGame('Pac-Man', 'https://freepacman.org/')">Play Now</button>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
